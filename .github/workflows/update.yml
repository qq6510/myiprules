name: Update Merged MRS

on:
  schedule:
    - cron: "13 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # 改回稳定版本，默认只进行浅克隆 (fetch-depth: 1)

      - name: Set up Python
        uses: actions/setup-python@v5  # 改回稳定版本
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Download Mihomo Kernel
        run: |
          wget -q -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.13/mihomo-linux-amd64-v1.19.13.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Run Merge and Convert
        run: python convert.py

      - name: Git Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 去除 || true，让真正的错误能够暴露出来
          git add -f output/*
          
          if git diff --staged --quiet; then
            echo "Warning: No changes detected in output files. Skipping push."
            exit 0
          fi
          
          git commit -m "Auto Update: $(date +'%Y-%m-%d %H:%M:%S')"
          
          # 保持 rebase，防止极端情况下的并发冲突
          git pull --rebase -X theirs origin main
          
          # 简化推送命令
          git push origin main
