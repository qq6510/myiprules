name: Update Filters

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'LICENSE'
      - 'rules/**'
    branches: [ main ]
  schedule:
    - cron: "13 8 * * *"
  workflow_dispatch:

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - uses: actions/checkout@main

      # --- 1. 先把昨天的历史账本备份到系统临时文件夹，防止被清理 ---
      - name: Backup IP History
        run: cp txt/server_ip_history.txt /tmp/ || true

      # 2. 正常运行你的构建脚本（这里哪怕它删除了 txt 文件夹也没关系）
      - name: Build Rules
        run: bash ./script/build-combined-rules.sh
      
      # --- 3. 把账本拿回来，并追加今天的新记录 ---
      - name: Restore and Append Server Info
        run: |
          mkdir -p txt
          cp /tmp/server_ip_history.txt txt/ || true
          echo "=== Run at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ===" >> txt/server_ip_history.txt
          curl -s ipinfo.io >> txt/server_ip_history.txt
          echo -e "\n" >> txt/server_ip_history.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "🚀 CI Updated"
          
          # 推送前拉取并合并，防止冲突
          git pull --rebase -X theirs origin main
          
          git push origin main

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
