name: Update Merged MRS

on:
  schedule:
    - cron: "13 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@main  # 修改处 1：由 @v4 改为 @main
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@main  # 修改处 2：由 @v5 改为 @main
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Download Mihomo Kernel
        run: |
          wget -q -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.13/mihomo-linux-amd64-v1.19.13.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Run Merge and Convert
        run: python convert.py

      - name: Git Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -f output/* || true
          
          if git diff --staged --quiet; then
            echo "Warning: No changes detected in output files. Skipping push."
            exit 0
          fi
          
          git commit -m "Auto Update: $(date +'%Y-%m-%d %H:%M:%S')"
          
          git pull --rebase -X theirs origin main
          
          git push origin HEAD:main
